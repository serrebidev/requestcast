{% extends "base.html" %}
{% block title %}Log in — RequestCast{% endblock %}
{% block content %}
<section class="narrow" aria-labelledby="login-heading">
  <h1 id="login-heading">Log in</h1>
  <p>Enter the shared password to search for and add request-only music.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next or request.args.get('next', '') }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
