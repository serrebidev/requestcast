<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RequestCast{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('stylesheet') }}">
</head>
<body>
  <header>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="header-row">
      <p class="site-name"><a href="{{ url_for('index') }}">RequestCast</a></p>
      {% if session.get('authenticated') %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button type="submit" class="secondary">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main id="main">
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p><a href="https://github.com/serrebidev/requestcast">RequestCast on GitHub</a></p>
  </footer>
</body>
</html>
