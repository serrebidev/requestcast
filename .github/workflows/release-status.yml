name: Record Windows release status

on:
  workflow_run:
    workflows:
      - Build Windows release
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Record result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-windows-status.txt <<'EOF'
          conclusion=${{ github.event.workflow_run.conclusion }}
          run_id=${{ github.event.workflow_run.id }}
          run_url=${{ github.event.workflow_run.html_url }}
          source_sha=${{ github.event.workflow_run.head_sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch protection rejects direct bot pushes to main (GH006), so
          # the record lands via a short-lived branch and an auto-merging PR.
          branch="bot/release-status-${{ github.event.workflow_run.id }}"
          git switch -c "$branch"
          git add release-windows-status.txt
          git commit -m "Record Windows release status: ${{ github.event.workflow_run.conclusion }}"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Record Windows release status: ${{ github.event.workflow_run.conclusion }}" \
            --body "Automated status record for Windows release run ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.conclusion }}).")"
          # A PR with nothing to wait for can be "clean" instantly, and
          # GitHub then refuses to enable auto-merge; fall back to a direct
          # merge in that case.
          gh pr merge "$pr_url" --auto --squash || gh pr merge "$pr_url" --squash
          # Auto-merge does not reliably trigger the repo's delete-branch-on-
          # merge for bot PRs, so wait for the merge and delete the branch
          # here. If it has not merged in ~5 minutes the record still lands
          # via auto-merge; only the cleanup is skipped.
          for i in $(seq 1 30); do
            if [ "$(gh pr view "$pr_url" --json state --jq .state)" = "MERGED" ]; then
              git push origin --delete "$branch" || true
              break
            fi
            sleep 10
          done
