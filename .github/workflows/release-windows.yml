name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag override
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - requestcast/__init__.py

permissions:
  contents: write

concurrency:
  group: requestcast-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify Requests dependency compatibility
        shell: pwsh
        run: python -W error -c "import requests; print(f'Requests {requests.__version__} dependency check passed.')"

      - name: Integrate YouTube collection support
        shell: pwsh
        run: |
          python scripts/apply_youtube_collections_patch.py
          $changes = git status --porcelain -- requestcast/app.py
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requestcast/app.py
            git commit -m "Enable YouTube playlist and channel URLs"
            git push origin HEAD:main
          }
          $sourceSha = git rev-parse HEAD
          "SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Determine release metadata
        shell: pwsh
        run: |
          $version = python -c "from requestcast import __version__; print(__version__)"
          $requestedTag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $tag = "v$version"
          }
          else {
            $tag = $requestedTag
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TITLE=RequestCast $version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ZIP=RequestCast-$tag-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test local web access and YouTube collections
        shell: pwsh
        env:
          REQUESTCAST_DISABLE_WORKER: '1'
        run: |
          $log = "release-windows-test-output.txt"
          python -m compileall -q requestcast tests *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            python tests/test_loopback_access.py *>> $log
            $exitCode = $LASTEXITCODE
          }
          if ($exitCode -eq 0) {
            python tests/test_youtube_collections.py *>> $log
            $exitCode = $LASTEXITCODE
          }
          Get-Content $log
          if ($exitCode -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $log
            git commit -m "Record Windows release test failure"
            git push origin HEAD:main
            exit $exitCode
          }
          Remove-Item $log

      - name: Build and test portable executable
        shell: pwsh
        run: python scripts/build_windows.py

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\RequestCast\*" -DestinationPath "$env:RELEASE_ZIP" -Force

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Fixes the Windows browser not opening automatically. RequestCast now waits until the local web server is accepting connections, then opens http://127.0.0.1:8797/ through the Windows default-browser handler with multiple fallbacks. Both localhost and 127.0.0.1 remain available. Also includes the loopback and Requests dependency fixes from 1.3.2."
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:RELEASE_TAG" --title "$env:RELEASE_TITLE" --notes "$notes"
            gh release upload "$env:RELEASE_TAG" "$env:RELEASE_ZIP" --clobber
          }
          else {
            gh release create "$env:RELEASE_TAG" "$env:RELEASE_ZIP" --target "$env:SOURCE_SHA" --title "$env:RELEASE_TITLE" --notes "$notes"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RequestCast-${{ env.RELEASE_TAG }}-windows-x64
          path: ${{ env.RELEASE_ZIP }}
