name: Build Windows release

# Manual only: the Forgejo-to-GitHub sync disables GitHub workflows with
# automatic triggers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag override
        required: false
        default: ''
      dry_run:
        description: Build and sign only; publish nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: requestcast-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify Requests dependency compatibility
        shell: pwsh
        run: python -W error -c "import requests; print(f'Requests {requests.__version__} dependency check passed.')"

      - name: Integrate YouTube collection support
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/apply_youtube_collections_patch.py
          $sourceSha = git rev-parse HEAD
          $changes = git status --porcelain -- requestcast/app.py
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requestcast/app.py
            git commit -m "Enable YouTube playlist and channel URLs"
            $sourceSha = git rev-parse HEAD
            # Forgejo has no branch protection on main, so the commit pushes
            # directly (the old GitHub PR dance existed only for GH006).
            if ("${{ inputs.dry_run }}" -ne "true") {
              git push origin HEAD:main
              if ($LASTEXITCODE -ne 0) { throw "Pushing the YouTube collections commit to main failed." }
            }
          }
          "SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Determine release metadata
        shell: pwsh
        run: |
          $version = python -c "from requestcast import __version__; print(__version__)"
          $requestedTag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $tag = "v$version"
          }
          else {
            $tag = $requestedTag
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TITLE=RequestCast $version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_ZIP=RequestCast-$tag-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test web access, framing, diagnostics, and YouTube collections
        shell: pwsh
        env:
          REQUESTCAST_DISABLE_WORKER: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = "release-windows-test-output.txt"
          python -m compileall -q requestcast tests *> $log
          $exitCode = $LASTEXITCODE
          $suite = @(
            'tests/test_loopback_access.py',
            'tests/test_http_framing.py',
            'tests/test_diagnostics.py',
            'tests/test_youtube_collections.py',
            'tests/test_browser_and_diagnostics.py',
            'tests/test_download_permissions.py',
            'tests/test_musicdl_source.py',
            'tests/test_playlist_import.py',
            'tests/test_large_import.py',
            'tests/test_search_limits.py',
            'tests/test_download_retries.py',
            'tests/test_orphaned_jobs.py',
            'tests/test_tool_updates.py'
          )
          foreach ($test in $suite) {
            if ($exitCode -ne 0) { break }
            python $test *>> $log
            $exitCode = $LASTEXITCODE
          }
          Get-Content $log
          if ($exitCode -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $log
            git commit -m "Record Windows release test failure"
            # Forgejo has no branch protection on main: push the record
            # directly (the old GitHub PR dance existed only for GH006).
            if ("${{ inputs.dry_run }}" -ne "true") { git push origin HEAD:main }
            exit $exitCode
          }
          Remove-Item $log

      - name: Build and test portable executable
        shell: pwsh
        run: python scripts/build_windows.py

      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\RequestCast\*" -DestinationPath "$env:RELEASE_ZIP" -Force

      - name: Create or update Forgejo release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          API_URL: https://git.serrebiradio.com/api/v1
          REPO: serrebi/requestcast
        run: |
          $script = @'
          import os, requests
          api = os.environ["API_URL"].rstrip("/")
          repo = os.environ["REPO"]
          tag = os.environ["RELEASE_TAG"]
          title = os.environ["RELEASE_TITLE"]
          zip_path = os.environ["RELEASE_ZIP"]
          sha = os.environ["SOURCE_SHA"]
          token = os.environ.get("FORGEJO_TOKEN") or os.environ.get("GH_TOKEN")
          headers = {"Authorization": f"token {token}"}
          notes = open("docs/release-notes.md", encoding="utf-8").read()
          r = requests.get(f"{api}/repos/{repo}/releases/tags/{tag}", headers=headers)
          if r.status_code == 200:
              rel = r.json()
              rid = rel["id"]
              requests.patch(f"{api}/repos/{repo}/releases/{rid}", headers=headers,
                             json={"name": title, "body": notes}).raise_for_status()
              for asset in rel.get("assets", []):
                  if asset["name"] == os.path.basename(zip_path):
                      requests.delete(f"{api}/repos/{repo}/releases/{rid}/assets/{asset['id']}",
                                      headers=headers).raise_for_status()
          else:
              r = requests.post(f"{api}/repos/{repo}/releases", headers=headers,
                                json={"tag_name": tag, "name": title, "body": notes,
                                      "target_commitish": sha})
              r.raise_for_status()
              rid = r.json()["id"]
          with open(zip_path, "rb") as fh:
              up = requests.post(f"{api}/repos/{repo}/releases/{rid}/assets", headers=headers,
                                 params={"name": os.path.basename(zip_path)},
                                 files={"attachment": fh})
              up.raise_for_status()
          print(f"Published {tag} to Forgejo (release id {rid}) with {zip_path}")
          '@
          Set-Content -Path publish_release.py -Value $script -Encoding utf8
          python publish_release.py
